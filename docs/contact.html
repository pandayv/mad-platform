<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guardian Pest Control — Contact</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="index.html">Guardian Pest Control</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <h1>Get In Touch</h1>
  <p>Fill out the form below and we'll get back to you within one business day.
     <button class="icon-button" aria-hidden="true">&#128222;</button>
  </p>

  <form>
    <label for="name-field">Full Name</label>
    <input type="text" id="name-field" name="name">

    <input type="email" name="email" placeholder="Email Address">

    <label for="phone-field">Phone Number</label>
    <input type="tel" id="phone-field" name="phone">

    <label for="message-field">What's the issue?</label>
    <textarea id="message-field" name="message" rows="4"></textarea>

    <button type="submit">Send Message</button>
  </form>

  <h3>Service Area</h3>
  <p>We proudly serve homes and businesses within 30 miles of our office.</p>
</main>

<footer>
  <p>&copy; 2026 Guardian Pest Control. All rights reserved.</p>
</footer>
</body>
</html>
